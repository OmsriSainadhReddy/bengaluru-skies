<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bengaluru Skies</title>
<meta name="description" content="Umbrella or not, and the best time to run today in Bengaluru.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#1F2A44; --violet:#5B4B8A; --jacaranda:#B79BE6; --raintree:#2F5D50;
    --mist:#EEF2F6; --auto:#F2C230;
    --ink:#1F2A44; --ink-soft:rgba(31,42,68,.72); --panel:rgba(255,255,255,.74); --panel-line:rgba(31,42,68,.12);
    --sky-a:#86AFD8; --sky-b:#CFC3EC; --sky-c:#F3DCC9;
    --hill:#9A92BF; --mid:#3E6E60; --front:#24473F;
  }
  body[data-mood="rain"]{
    --ink:#F4F6FA; --ink-soft:rgba(244,246,250,.78); --panel:rgba(20,28,46,.48); --panel-line:rgba(244,246,250,.16);
    --sky-a:#2E3A55; --sky-b:#56647E; --sky-c:#8E9AAE;
    --hill:#5F6A84; --mid:#2C4A45; --front:#1A3330;
  }
  body[data-mood="night"]{
    --ink:#F1EEFA; --ink-soft:rgba(241,238,250,.76); --panel:rgba(18,20,44,.5); --panel-line:rgba(241,238,250,.15);
    --sky-a:#101633; --sky-b:#2B2D5C; --sky-c:#5B4B8A;
    --hill:#3A3767; --mid:#1F3A3B; --front:#142826;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Hanken Grotesk",system-ui,sans-serif; color:var(--ink);
    background:var(--sky-a); transition:color .6s ease;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .scene{position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,var(--sky-c) 100%)}
  .scene svg{position:absolute;left:0;bottom:0;width:100%;height:46vh;min-height:260px}
  .scene canvas{position:absolute;inset:0;width:100%;height:100%}
  .sun{position:absolute;right:12vw;top:12vh;width:120px;height:120px;border-radius:50%;
       background:radial-gradient(circle,#FFF6E0 0%,rgba(255,236,200,.5) 45%,rgba(255,236,200,0) 70%);transition:opacity 1s}
  body[data-mood="rain"] .sun{opacity:0}
  body[data-mood="night"] .sun{background:radial-gradient(circle,#F4F1FF 0%,rgba(220,214,255,.35) 30%,rgba(220,214,255,0) 60%);width:90px;height:90px}

  main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:clamp(96px,13vh,120px) 22px 32vh}
  .hello{margin:0;max-width:40ch}
  .hello .l1{display:block;font-size:1.3rem;line-height:1.4;color:var(--ink)}
  .hello .l1 strong{font-weight:600}
  .hello .l2{display:block;margin-top:6px;font-size:1rem;color:var(--ink-soft)}

  .answer{margin-top:clamp(36px,7vh,72px)}
  .q{font-size:1rem;font-weight:500;margin:0 0 6px;color:var(--ink-soft)}
  .verdict{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(2.6rem,9vw,4.8rem);line-height:1.02;letter-spacing:-.01em;margin:0}
  .why{font-size:1.15rem;line-height:1.5;max-width:34ch;margin:14px 0 0}
  .verdict .icon{display:inline-block;width:.78em;height:.78em;vertical-align:-.04em;margin-right:.18em}
  .verdict .icon svg{width:100%;height:100%}

  .day{margin-top:clamp(48px,9vh,96px);background:var(--panel);border:1px solid var(--panel-line);
       backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
       border-radius:22px;padding:20px 18px 16px}
  .day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .day-head h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.45rem;margin:0}
  .tabs{display:inline-flex;border:1px solid var(--panel-line);border-radius:999px;padding:3px}
  .tabs button{font:inherit;font-size:.92rem;font-weight:500;color:var(--ink-soft);background:none;border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--sky-a)}
  body[data-mood="dry"] .tabs button[aria-selected="true"]{color:#fff}
  .tabs button:focus-visible,.retry:focus-visible{outline:2px solid var(--auto);outline-offset:2px}

  .strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(42px,1fr);gap:2px;overflow-x:auto;margin-top:18px;padding-bottom:6px;scrollbar-width:thin}
  .hr{display:grid;grid-template-rows:18px 96px 22px 18px 20px;justify-items:center;align-items:end;font-size:.8rem;border-radius:12px;padding:4px 0 6px;position:relative}
  .hr.now{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px var(--panel-line)}
  .hr .pct{color:var(--ink-soft);font-variant-numeric:tabular-nums;align-self:end}
  .hr .bar{width:14px;height:100%;border-radius:8px;background:rgba(127,140,170,.18);position:relative;overflow:hidden}
  .hr .bar i{position:absolute;left:0;right:0;bottom:0;border-radius:8px;background:linear-gradient(180deg,#9FC3F0,#5C8BD6)}
  body[data-mood="rain"] .hr .bar i,body[data-mood="night"] .hr .bar i{background:linear-gradient(180deg,#C6DCFA,#7FA6E8)}
  .hr .aq{width:12px;height:12px;border-radius:50%;align-self:center}
  .hr .t{font-weight:600;font-variant-numeric:tabular-nums}
  .hr .h{color:var(--ink-soft)}
  .hr.commute .h{color:var(--ink);font-weight:600}
  .hr.commute::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:2px;background:var(--auto)}
  .hr.run{box-shadow:inset 0 0 0 2px var(--jacaranda)}
  .key{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 2px 0;font-size:.85rem;color:var(--ink-soft)}
  .key span{display:inline-flex;align-items:center;gap:6px}
  .key i{display:inline-block}
  .k-bar{width:8px;height:14px;border-radius:4px;background:#6E97DC}
  .k-dot{width:10px;height:10px;border-radius:50%;background:#7FC8A9}
  .k-com{width:16px;height:3px;border-radius:2px;background:var(--auto)}
  .k-run{width:14px;height:14px;border-radius:5px;box-shadow:inset 0 0 0 2px var(--jacaranda)}

  footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--panel-line);font-size:.88rem;color:var(--ink-soft);line-height:1.6}
  footer a{color:inherit}
  .note{display:none;margin-top:14px;padding:10px 14px;border-radius:12px;background:rgba(242,194,48,.16);font-size:.9rem;line-height:1.5}
  .note.show{display:block}
  .retry{font:inherit;font-weight:600;color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}

  .clocks{position:absolute;top:16px;right:16px;z-index:2;display:flex;background:var(--panel);border:1px solid var(--panel-line);
          backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:8px 4px}
  .clock{display:grid;grid-template-columns:auto auto;column-gap:7px;align-items:baseline;padding:0 12px}
  .clock + .clock{border-left:1px solid var(--panel-line)}
  .clock .city{grid-column:1 / -1;font-size:.78rem;color:var(--ink-soft);margin-bottom:2px}
  .clock .time{font-family:"Young Serif",Georgia,serif;font-size:1.3rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .clock .wday{font-size:.78rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
  .clock .wday svg{width:12px;height:12px}
  @media (max-width:520px){.clocks{top:12px;right:12px;padding:6px 2px}.clock{padding:0 9px}.clock .time{font-size:1.1rem}}
  .parks{margin-top:20px}
  .park-pick{margin:14px 0 0}
  .park-pick .name{font-family:"Young Serif",Georgia,serif;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.05;margin:0}
  .park-pick .reason{font-size:1.05rem;line-height:1.5;max-width:46ch;margin:8px 0 0}
  .map{width:100%;height:auto;display:block;margin-top:14px;border-radius:16px;background:rgba(255,255,255,.22);border:1px solid var(--panel-line)}
  body[data-mood="rain"] .map,body[data-mood="night"] .map{background:rgba(255,255,255,.05)}
  .map text{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:14px;fill:var(--ink)}
  .map .sub{font-size:12px;fill:var(--ink-soft)}
  .map .grid{stroke:var(--panel-line);stroke-width:1}
  .map .street{fill:none;stroke:var(--panel-line);stroke-width:7;stroke-linecap:round}
  .map .park{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center}
  .map .park.on{transform:scale(1.18)}
  .map .route{fill:none;stroke:var(--auto);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1 9}
  .map .route-draw{fill:none;stroke:var(--auto);stroke-width:3.5;stroke-linecap:round}
  .map .ripple{fill:none;stroke:var(--jacaranda);stroke-width:2;opacity:0}
  .map .ripple.go{animation:ripple 1.6s ease-out 2}
  @keyframes ripple{from{r:10;opacity:.9}to{r:40;opacity:0}}
  .map .leaf{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .park-list{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .park-list button{width:100%;text-align:left;font:inherit;color:var(--ink);background:rgba(255,255,255,.14);border:1px solid var(--panel-line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:background .25s,border-color .25s,transform .25s}
  .park-list button:hover{background:rgba(255,255,255,.26)}
  .park-list button[aria-pressed="true"]{border-color:var(--jacaranda);background:rgba(183,155,230,.22)}
  .park-list button:focus-visible{outline:2px solid var(--auto);outline-offset:2px}
  .park-list b{display:block;font-weight:600;font-size:.95rem}
  .park-list span{display:block;font-size:.82rem;color:var(--ink-soft);margin-top:2px}
  .park-list .tag{display:inline-block;margin-top:6px;font-size:.75rem;font-weight:600;color:var(--indigo);background:var(--auto);border-radius:999px;padding:2px 8px}
  .fade-swap{animation:swap .45s ease}
  @keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.map .leaf,.map .ripple.go,.fade-swap{animation:none}.map .park{transition:none}}
  .reveal{opacity:0;transform:translateY(10px)}
  .ready .reveal{opacity:1;transform:none;transition:opacity .8s ease,transform .8s ease}
  .ready .reveal.d2{transition-delay:.25s}.ready .reveal.d3{transition-delay:.5s}
  @media (prefers-reduced-motion:reduce){.reveal,.ready .reveal{opacity:1;transform:none;transition:none}body{transition:none}}
  @media (max-width:520px){.why{font-size:1.05rem}.day{padding:16px 12px 14px}}
</style>
</head>
<body data-mood="dry">
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <canvas id="fx"></canvas>
    <svg id="land" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice"></svg>
  </div>

  <div class="clocks" aria-label="Local times">
    <div class="clock"><span class="city">Washington, DC</span><span class="time" id="tDC">&nbsp;</span><span class="wday" id="dDC"></span></div>
    <div class="clock"><span class="city">Bengaluru</span><span class="time" id="tBLR">&nbsp;</span><span class="wday" id="dBLR"></span></div>
  </div>

  <main id="app">
    <p class="hello reveal" id="hello">Good morning.</p>

    <section class="answer reveal d2" aria-live="polite">
      <p class="q">Umbrella today?</p>
      <h1 class="verdict" id="umbrella">Checking the sky…</h1>
      <p class="why" id="umbrellaWhy"></p>
    </section>

    <section class="answer reveal d3" aria-live="polite">
      <p class="q">When should you run?</p>
      <h2 class="verdict" id="run">&nbsp;</h2>
      <p class="why" id="runWhy"></p>
    </section>

    <section class="day reveal d3" aria-label="Hour by hour">
      <div class="day-head">
        <h2>Hour by hour</h2>
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-day="0">Today</button>
          <button role="tab" aria-selected="false" data-day="1">Tomorrow</button>
        </div>
      </div>
      <div class="strip" id="strip"></div>
      <div class="key">
        <span><i class="k-bar"></i>Chance of rain</span>
        <span><i class="k-dot"></i>Air quality</span>
        <span><i class="k-com"></i>Commute</span>
        <span><i class="k-run"></i>Best run</span>
      </div>
    </section>

    <section class="day parks reveal d3" aria-label="Where to run today" aria-live="polite">
      <div class="day-head"><h2 id="parkHead">Where your running shoes are headed</h2></div>
      <div class="park-pick" id="parkPick">
        <p class="name" id="parkName">&nbsp;</p>
        <p class="reason" id="parkWhy"></p>
      </div>
      <svg class="map" id="map" viewBox="0 0 420 290" role="img" aria-label="Map of parks near home"></svg>
      <ul class="park-list" id="parkList"></ul>
      <div class="note" id="note"></div>
      <footer id="foot"></footer>
    </section>
  </main>

<script>
/* ---------- Settings: change these ---------- */
const CONFIG = {
  herName: "Monika",           // shows in the greeting
  madeBy: "Omsri",
  place: "Koramangala",
  lat: 12.9352, lon: 77.6245,  // Koramangala, Bengaluru
  commute: [[8, 9], [18, 19]], // hours she's outside: to office, back home
  runHours: [[5, 8], [17, 19]],// hours she'd consider running
  rainYes: 55,                 // % chance that means "take it"
  rainMaybe: 30                // % chance that means "pack the small one"
};
/* -------------------------------------------- */

const TZ = "Asia/Kolkata";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmtHour = h => { const s = h < 12 ? "am" : "pm"; const x = h % 12 || 12; return `${x} ${s}`; };
const nowParts = () => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { date:`${p.year}-${p.month}-${p.day}`, hour:+p.hour % 24, minute:+p.minute };
};
const aqiInfo = v => v == null ? {c:"rgba(127,140,170,.4)", w:"unknown"}
  : v <= 50 ? {c:"#7FC8A9", w:"clean"} : v <= 100 ? {c:"#F2C230", w:"okay"}
  : v <= 150 ? {c:"#F28C38", w:"a bit hazy"} : v <= 200 ? {c:"#E0525B", w:"poor"} : {c:"#9B4DCA", w:"very poor"};
const RAIN_CODES = new Set([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99]);

let DATA = null, day = 0, sample = false;

async function load(){
  const q = `latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&timezone=${encodeURIComponent(TZ)}&forecast_days=2`;
  try{
    const [w, a] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?${q}&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code&current=temperature_2m,weather_code,is_day&daily=sunrise,sunset`).then(r=>{if(!r.ok)throw 0;return r.json();}),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&hourly=us_aqi,pm2_5&current=us_aqi`).then(r=>{if(!r.ok)throw 0;return r.json();})
    ]);
    DATA = merge(w, a); sample = false;
  }catch(e){
    DATA = sampleData(); sample = true;
  }
  render();
}

function merge(w, a){
  const aIdx = {}; a.hourly.time.forEach((t,i)=>aIdx[t]=i);
  const hours = w.hourly.time.map((t,i)=>({
    t, temp:w.hourly.temperature_2m[i], feels:w.hourly.apparent_temperature[i],
    rain:w.hourly.precipitation_probability[i] ?? 0, mm:w.hourly.precipitation[i] ?? 0,
    code:w.hourly.weather_code[i],
    aqi: aIdx[t]!=null ? a.hourly.us_aqi[aIdx[t]] : null
  }));
  return { dates:w.daily.time, hours, current:{ code:w.current.weather_code, isDay:w.current.is_day, temp:w.current.temperature_2m }, updated:new Date() };
}

function sampleData(){
  const n = nowParts(); const d0 = new Date(n.date+"T00:00:00Z");
  const dates = [0,1].map(k=>new Date(d0.getTime()+k*864e5).toISOString().slice(0,10));
  const hours = [];
  dates.forEach((d,k)=>{ for(let h=0;h<24;h++){
    const storm = Math.exp(-Math.pow(h-(k?15:17),2)/6);
    hours.push({ t:`${d}T${pad(h)}:00`, temp:Math.round(23+5*Math.sin((h-9)/24*2*Math.PI)), feels:Math.round(23+6*Math.sin((h-9)/24*2*Math.PI)),
      rain:Math.round(8+(k?50:68)*storm), mm:storm>.5?1.2:0, code:storm>.6?80:2,
      aqi:Math.round(42+38*Math.max(0,Math.sin((h-6)/24*2*Math.PI))+(h>18?22:0)) });
  }});
  return { dates, hours, current:{code:2,isDay:n.hour>=6&&n.hour<18?1:0,temp:24}, updated:new Date() };
}

const hoursFor = (dateIdx) => DATA.hours.filter(h=>h.t.startsWith(DATA.dates[dateIdx]));
const hourOf = h => +h.t.slice(11,13);

function decide(){
  const n = nowParts();
  const lastOut = CONFIG.commute[CONFIG.commute.length-1][1];
  const useTomorrow = n.hour > lastOut;
  const di = useTomorrow ? 1 : 0;
  const from = useTomorrow ? CONFIG.commute[0][0] : Math.max(n.hour, CONFIG.commute[0][0]);
  const span = hoursFor(di).filter(h=>hourOf(h)>=from && hourOf(h)<=lastOut);
  const peak = span.reduce((m,h)=>h.rain>m.rain?h:m, span[0] || {rain:0,t:"T00"});
  const mm = span.reduce((s,h)=>s+h.mm,0);
  const ph = hourOf(peak);
  const inCommute = CONFIG.commute.some(([a,b])=>ph>=a&&ph<=b);
  const when = useTomorrow ? "tomorrow" : "today";
  let u;
  if(peak.rain >= CONFIG.rainYes || mm >= 1){
    u = { v:"Take the umbrella.", icon:"open",
          why:`Showers are likely around ${fmtHour(ph)} (${peak.rain}%)` + (inCommute ? ", right when you're on the road." : ".") };
  } else if(peak.rain >= CONFIG.rainMaybe){
    u = { v:"Pack the small one.", icon:"open",
          why:`There's a ${peak.rain}% chance of a shower around ${fmtHour(ph)}. Probably nothing, but this is Bengaluru.` };
  } else {
    u = { v:"Leave it at home.", icon:"closed",
          why:`Dry ${when}. The chance of rain stays under ${Math.max(10, Math.ceil(peak.rain/10)*10)}% until evening.` };
  }
  if(useTomorrow) u.why = "For tomorrow: " + u.why.charAt(0).toLowerCase() + u.why.slice(1);

  // best run hour
  const pick = (dIdx, minHour) => hoursFor(dIdx).filter(h=>{
    const x=hourOf(h); return x>=minHour && CONFIG.runHours.some(([a,b])=>x>=a&&x<=b);
  });
  let rd = 0, cands = pick(0, n.minute > 20 ? n.hour+1 : n.hour);
  if(!cands.length){ rd = 1; cands = pick(1, 0); }
  const score = h => (h.aqi ?? 80) + h.rain*0.9 + Math.max(0,(h.feels ?? h.temp)-25)*7;
  const best = cands.reduce((m,h)=>score(h)<score(m)?h:m, cands[0]);
  const bh = hourOf(best), aq = aqiInfo(best.aqi);
  let r;
  if((best.aqi ?? 0) > 150 || best.rain >= 70){
    r = { v:"Treadmill day.", why: best.rain >= 70
      ? `Even the best slot has a ${best.rain}% chance of rain. Save your knees for tomorrow.`
      : `The air is ${aq.w} all day (AQI ${best.aqi}). Run indoors if you can.` };
  } else {
    const t = Math.round(best.temp);
    r = { v: (rd ? "Tomorrow, " : "") + fmtHour(bh) + ".",
          why:`The air is ${aq.w} then (AQI ${best.aqi ?? "n/a"}), it'll be ${t}°, and there's a ${best.rain}% chance of rain.` };
  }
  const treadmill = (best.aqi ?? 0) > 150 || best.rain >= 70;
  return { u, r, runDay:rd, runHour:bh, best, treadmill };
}

const ICONS = {
  open:`<svg viewBox="0 0 48 48" fill="none"><path d="M4 24C4 13 13 5 24 5s20 8 20 19c-2.4-2.2-5-2.2-6.7 0-2.4-2.2-5.2-2.2-6.6 0-2-2.2-4.7-2.2-6.7 0-2-2.2-4.7-2.2-6.7 0-1.8-2.2-4.5-2.2-6.6 0-1.8-2.2-4.4-2.2-6.7 0Z" fill="#F2C230"/><path d="M24 24v14a4 4 0 0 1-8 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`,
  closed:`<svg viewBox="0 0 48 48" fill="none"><path d="M24 4 31 30H17Z" fill="#F2C230"/><path d="M24 30v8a4 4 0 0 1-8 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`
};

function render(){
  const n = nowParts();
  const cur = DATA.current;
  const raining = RAIN_CODES.has(cur.code) || (hoursFor(0).find(h=>hourOf(h)===n.hour)?.rain ?? 0) >= 60;
  document.body.dataset.mood = raining ? "rain" : (cur.isDay ? "dry" : "night");
  startFx();

  const g = n.hour < 5 ? "Hello" : n.hour < 12 ? "Good morning" : n.hour < 17 ? "Good afternoon" : "Good evening";
  const dateStr = new Intl.DateTimeFormat("en-IN",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"}).format(new Date());
  const fun = funLine(n.hour, document.body.dataset.mood);
  $("hello").innerHTML = `<span class="l1">${g}${CONFIG.herName ? ", <strong>"+esc(CONFIG.herName)+"</strong>" : ""}. ${fun}</span>`
    + `<span class="l2">It's ${dateStr} in ${esc(CONFIG.place)}, and ${Math.round(cur.temp)}° outside.</span>`;

  const d = decide();
  $("umbrella").innerHTML = `<span class="icon">${ICONS[d.u.icon]}</span>${d.u.v}`;
  $("umbrellaWhy").textContent = d.u.why;
  $("run").textContent = d.r.v;
  $("runWhy").textContent = d.r.why;
  DATA._run = d;
  drawStrip();
  drawParks(d);

  const time = new Intl.DateTimeFormat("en-IN",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).format(DATA.updated);
  $("foot").innerHTML = `Updated ${time.toLowerCase()} IST. Weather and air from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.<br>Made for you by ${esc(CONFIG.madeBy)}, from the other side of the world.`;
  const note = $("note");
  if(sample){ note.innerHTML = `Live weather didn't load, so this shows sample weather. It loads properly once the page is hosted (for example on GitHub Pages). <button class="retry" id="retry">Try again</button>`; note.classList.add("show"); $("retry").onclick = load; }
  else note.classList.remove("show");
}

function drawStrip(){
  const n = nowParts();
  const run = DATA._run;
  const list = hoursFor(day).filter(h=>hourOf(h)>=5);
  $("strip").innerHTML = list.map(h=>{
    const x = hourOf(h), a = aqiInfo(h.aqi);
    const cls = ["hr"];
    if(day===0 && x===n.hour) cls.push("now");
    if(CONFIG.commute.some(([p,q])=>x>=p&&x<=q)) cls.push("commute");
    if(run.runDay===day && run.runHour===x) cls.push("run");
    const lbl = `${fmtHour(x)}: ${h.rain}% chance of rain, ${Math.round(h.temp)} degrees, air ${a.w}`;
    return `<div class="${cls.join(" ")}" role="img" aria-label="${lbl}" title="${lbl}${h.aqi!=null?` (AQI ${h.aqi})`:""}">
      <span class="pct">${h.rain>=20?h.rain+"%":""}</span>
      <span class="bar"><i style="height:${Math.max(0,h.rain)}%"></i></span>
      <span class="aq" style="background:${a.c}"></span>
      <span class="t">${Math.round(h.temp)}°</span>
      <span class="h">${x===12?"noon":(x%12||12)+(x<12?"a":"p")}</span>
    </div>`;
  }).join("");
  const nowEl = $("strip").querySelector(".now");
  if(nowEl) $("strip").scrollLeft = Math.max(0, nowEl.offsetLeft - 60);
}

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  day = +b.dataset.day;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected", x===b));
  drawStrip();
}));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Landscape: Cubbon Park rain trees ---------- */
(function land(){
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const tree = (x, base, s, fill) => {
    const w = 120*s, h = 46*s, tr = 70*s;
    let blobs = "";
    for(let i=0;i<7;i++){
      const bx = x + (rnd()-.5)*w*1.2, by = base - tr - (rnd())*h*.5;
      blobs += `<ellipse cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" rx="${(w*(.35+rnd()*.3)).toFixed(1)}" ry="${(h*(.45+rnd()*.3)).toFixed(1)}"/>`;
    }
    return `<g fill="${fill}"><path d="M${x-3*s} ${base} L${x-2*s} ${base-tr} L${x+2*s} ${base-tr} L${x+3*s} ${base}Z"/><path d="M${x} ${base-tr*.6} L${x-30*s} ${base-tr-6*s} L${x-27*s} ${base-tr-2*s}Z M${x} ${base-tr*.55} L${x+34*s} ${base-tr-8*s} L${x+30*s} ${base-tr-3*s}Z"/>${blobs}</g>`;
  };
  let svg = `<path d="M0 250 C180 205 300 230 460 210 S760 170 900 205 1180 190 1440 215 V420 H0Z" fill="var(--hill)" opacity=".55"/>`;
  // low skyline
  let city = ""; let x = 0;
  while(x < 1440){ const w = 26+rnd()*44, h = 30+rnd()*70; city += `<rect x="${x.toFixed(0)}" y="${(300-h).toFixed(0)}" width="${w.toFixed(0)}" height="${(h+120).toFixed(0)}"/>`; x += w + 4 + rnd()*10; }
  city += `<rect x="1010" y="150" width="6" height="160"/><rect x="1004" y="190" width="18" height="4"/><rect x="1006" y="215" width="14" height="4"/>`;
  svg += `<g fill="var(--hill)" opacity=".9">${city}</g>`;
  svg += `<path d="M0 330 H1440 V420 H0Z" fill="var(--mid)"/>`;
  [80,300,560,820,1090,1330].forEach(tx=>svg += tree(tx+rnd()*40, 336, .9+rnd()*.4, "var(--mid)"));
  svg += `<path d="M0 372 C240 360 480 380 720 368 S1200 362 1440 372 V420 H0Z" fill="var(--front)"/>`;
  [-20,200,430,700,960,1220,1460].forEach(tx=>svg += tree(tx+rnd()*50, 392, 1.3+rnd()*.5, "var(--front)"));
  $("land").innerHTML = svg;
})();

/* ---------- Rain or falling jacaranda petals ---------- */
let fxRaf = 0;
function startFx(){
  const c = $("fx"), ctx = c.getContext("2d"), mood = document.body.dataset.mood;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  cancelAnimationFrame(fxRaf);
  const dpr = Math.min(2, devicePixelRatio || 1);
  const size = () => { c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  size(); onresize = size;
  const W = () => innerWidth, H = () => innerHeight;
  const N = mood === "rain" ? Math.round(W()/5) : Math.round(W()/40);
  const parts = Array.from({length:N}, () => ({ x:Math.random()*W(), y:Math.random()*H(), v:.4+Math.random(), r:Math.random()*Math.PI*2, s:.6+Math.random()*.8 }));
  const frame = () => {
    ctx.clearRect(0,0,W(),H());
    if(mood === "rain"){
      ctx.strokeStyle = "rgba(220,230,245,.38)"; ctx.lineWidth = 1.1; ctx.beginPath();
      for(const p of parts){ ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-3*p.s,p.y+16*p.s);
        if(!reduce){ p.y += 9*p.v+6; p.x -= 1.6; if(p.y>H()){ p.y=-20; p.x=Math.random()*(W()+60); } } }
      ctx.stroke();
    } else {
      for(const p of parts){
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.fillStyle = mood==="night" ? "rgba(200,184,240,.55)" : "rgba(160,124,220,.7)";
        ctx.beginPath(); ctx.ellipse(0,0,5*p.s,3*p.s,0,0,Math.PI*2); ctx.fill(); ctx.restore();
        if(!reduce){ p.y += .35*p.v+.2; p.x += Math.sin((p.y+p.r*50)/60)*.5; p.r += .01*p.v;
          if(p.y>H()+10){ p.y=-10; p.x=Math.random()*W(); } }
      }
    }
    if(!reduce) fxRaf = requestAnimationFrame(frame);
  };
  frame();
}

/* ---------- Fun lines: a new one each day ---------- */
const dayIndex = () => Math.floor(Date.now()/864e5 + 5.5/24);
const pickDaily = (list, salt=0) => list[(dayIndex() + salt) % list.length];
function funLine(hour, mood){
  if(mood === "rain") return pickDaily([
    "The clouds are being dramatic again.",
    "Bengaluru is doing its surprise-shower thing.",
    "The sky didn't check the forecast either.",
    "Somewhere, an auto driver is refusing to go anywhere."
  ]);
  if(hour < 5) return pickDaily([
    "Either you're up very early or very late. No judgement.",
    "Even the dosa batter is still asleep."
  ]);
  if(hour < 12) return pickDaily([
    "Filter coffee first. Then this.",
    "The sky has opinions today. Here they are.",
    "Someone in Washington checked the weather for you.",
    "Here's today's weather, in less time than the Silk Board signal."
  ]);
  if(hour < 17) return pickDaily([
    "Halfway through the day. The sky is still making up its mind.",
    "Post-lunch slump? The sky gets one too.",
    "Someone in Washington just woke up and thought of you."
  ]);
  return pickDaily([
    "The sky's had a long day too.",
    "Day's done. Here's what the sky has planned next.",
    "Time to log off. The trees are waiting.",
    "Someone in Washington is having his morning coffee and thinking of you."
  ]);
}
const PARK_HEADS = [
  "Where your running shoes are headed",
  "Today's prescription: trees",
  "We picked a park so you don't have to",
  "Your shoes already know the way",
  "Today's green light"
];

/* ---------- Parks near home (locations and sizes from OpenStreetMap) ---------- */
const PARKS = [
  { id:"ngv",    name:"NGV Park",          lat:12.94465, lon:77.62390, acres:1.7, home:true,
    note:"Right by home and lined with trees." },
  { id:"lakshmi",name:"Lakshmi Devi Park", lat:12.93905, lon:77.61972, acres:2.4,
    note:"The biggest of the neighbourhood parks, a favourite with walkers." },
  { id:"leena",  name:"Leena Park",        lat:12.93762, lon:77.62115, acres:1.9, nudge:[12,6],
    note:"A change of scene in 6th Block." },
  { id:"agara",  name:"Agara Lake",        lat:12.92093, lon:77.64159, acres:95, lake:true,
    note:"A flat, paved track of about 3 km around the lake." }
];
const HOME = PARKS[0];
const kmBetween = (a,b) => { const R=6371, toR=Math.PI/180;
  const dLat=(b.lat-a.lat)*toR, dLon=(b.lon-a.lon)*toR;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h)); };
PARKS.forEach(p=>{ p.km = kmBetween(HOME,p);
  const dx=(p.lon-HOME.lon)*111.32*Math.cos(HOME.lat*Math.PI/180), dy=(p.lat-HOME.lat)*110.57;
  const r = 102*Math.sqrt(p.km), ang = Math.atan2(dy,dx);
  p.x = 205 + (p.km ? r*Math.cos(ang) : 0) + (p.nudge?.[0] ?? 0); p.y = 56 - (p.km ? r*Math.sin(ang) : 0) + (p.nudge?.[1] ?? 0); });

function pickPark(run){
  const b = run.best, w = aqiInfo(b.aqi).w, feels = Math.round(b.feels ?? b.temp);
  const runDate = new Date(DATA.dates[run.runDay]+"T12:00:00");
  const weekend = [0,6].includes(runDate.getDay());
  const doy = Math.floor((runDate - new Date(runDate.getFullYear(),0,0))/864e5);
  const P = id => PARKS.find(p=>p.id===id);
  if(run.treadmill) return { park:P("ngv"), skip:true,
    why: b.rain >= 70 ? "Heavy rain is likely at every good running time. If it clears, NGV is right by home." : `The air is ${w} today. If you go out anyway, keep it short at NGV.` };
  if(b.rain >= 40) return { park:P("ngv"), why:`There's a ${b.rain}% chance of rain, so stay close. NGV is right by home if it starts pouring.` };
  if(weekend && (b.aqi ?? 999) <= 100 && b.rain < 30) return { park:P("agara"), why:`It's the weekend and the air is ${w}. Go long: about 3 km of flat track around the lake.` };
  if(feels >= 28) return { park:P("ngv"), why:`It'll feel like ${feels}°. NGV's trees keep you in the shade.` };
  const rota = ["lakshmi","leena","ngv"][doy % 3];
  const why = {
    lakshmi:`Dry, and the air is ${w}. Lakshmi Devi is the biggest park nearby at 2.4 acres.`,
    leena:`Good conditions for a change of scene: Leena Park in 6th Block, under a kilometre away.`,
    ngv:`An easy one today. NGV is right by home, the air is ${w} and it's dry.`
  }[rota];
  return { park:P(rota), why };
}

let parkState = null;
function drawParks(run){
  const choice = pickPark(run);
  parkState = { choice, selected: choice.park.id };
  $("parkHead").textContent = choice.skip ? "Your shoes get a day off" : pickDaily(PARK_HEADS);
  $("parkName").textContent = choice.skip ? "Maybe skip the park today." : choice.park.name + ".";
  $("parkWhy").textContent = choice.why;
  $("parkList").innerHTML = PARKS.map(p=>`<li><button type="button" data-park="${p.id}" aria-pressed="${p.id===choice.park.id}">
      <b>${p.name}</b><span>${p.home ? "Home" : p.km.toFixed(1)+" km from home"}, ${p.acres} acres</span>
      ${p.id===choice.park.id && !choice.skip ? '<em class="tag">Today\'s pick</em>' : ""}</button></li>`).join("");
  $("parkList").querySelectorAll("button").forEach(btn=>btn.onclick=()=>selectPark(btn.dataset.park, true));
  drawMap(choice.park.id, true);
}

function selectPark(id, user){
  const p = PARKS.find(x=>x.id===id); parkState.selected = id;
  $("parkList").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.park===id));
  const pick = parkState.choice;
  const box = $("parkPick"); box.classList.remove("fade-swap"); void box.offsetWidth; box.classList.add("fade-swap");
  if(id === pick.park.id){ $("parkName").textContent = pick.skip ? "Maybe skip the park today." : p.name+"."; $("parkWhy").textContent = pick.why; }
  else { $("parkName").textContent = p.name + "."; $("parkWhy").textContent = p.note + (p.home ? "" : ` ${p.km.toFixed(1)} km from home.`); }
  drawMap(id, user);
}

function drawMap(targetId, animate){
  const svg = $("map"), t = PARKS.find(p=>p.id===targetId);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let g = "";
  for(let x=20;x<420;x+=40) g += `<line class="grid" x1="${x}" y1="0" x2="${x}" y2="290" stroke-dasharray="2 6"/>`;
  g += `<path class="street" d="M-10 92 C90 80 180 110 430 96"/><path class="street" d="M120 -10 C140 90 180 190 200 300"/><path class="street" d="M230 -10 C240 100 300 170 430 210"/>`;
  // parks
  PARKS.forEach(p=>{
    const on = p.id===targetId ? " on" : "";
    if(p.lake){
      g += `<g class="park${on}" data-id="${p.id}"><ellipse cx="${p.x}" cy="${p.y}" rx="44" ry="30" fill="#3E6E60" opacity=".55"/><ellipse cx="${p.x}" cy="${p.y}" rx="34" ry="21" fill="#7FA6E8"/>
            <path d="M${p.x-18} ${p.y-2} q6 -4 12 0 t12 0" stroke="#fff" stroke-opacity=".6" fill="none"/><path d="M${p.x-6} ${p.y+7} q6 -4 12 0 t12 0" stroke="#fff" stroke-opacity=".6" fill="none"/></g>`;
    } else {
      const r = 7 + Math.sqrt(p.acres)*3.6;
      g += `<g class="park${on}" data-id="${p.id}"><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="#3E6E60" opacity=".85"/>
            <g class="leaf" style="animation-delay:${(p.x%7)/3}s"><ellipse cx="${p.x-4}" cy="${p.y-3}" rx="6" ry="4.5" fill="#7FC8A9"/><ellipse cx="${p.x+4}" cy="${p.y-5}" rx="5" ry="4" fill="#9AD9BC"/></g></g>`;
    }
  });
  // home pin
  g += `<g transform="translate(${HOME.x} ${HOME.y-26})"><path d="M0 22 C-9 12 -10 6 -10 1 a10 10 0 0 1 20 0 c0 5 -1 11 -10 21Z" fill="#F2C230"/><circle cy="1" r="3.6" fill="#1F2A44"/></g>`;
  // labels
  const lab = { ngv:[22,2,"start"], lakshmi:[-19,2,"end"], leena:[19,10,"start"], agara:[0,46,"middle"] };
  PARKS.forEach(p=>{ const [dx,dy,anc] = lab[p.id];
    g += `<text x="${p.x+dx}" y="${p.y+dy}" text-anchor="${anc}" font-weight="${p.id===targetId?600:400}">${p.name}</text>`;
    g += `<text class="sub" x="${p.x+dx}" y="${p.y+dy+13}" text-anchor="${anc}">${p.home?"home":p.km.toFixed(1)+" km"}</text>`; });
  // route
  let route = "";
  if(!t.home){
    const mx = (HOME.x+t.x)/2 + (t.y-HOME.y)*0.18, my = (HOME.y+t.y)/2 - (t.x-HOME.x)*0.18;
    route = `M${HOME.x} ${HOME.y} Q${mx.toFixed(1)} ${my.toFixed(1)} ${t.x} ${t.y}`;
    g += `<path id="routeDraw" class="route-draw" d="${route}"/><circle id="runner" r="5" fill="#fff" stroke="#1F2A44" stroke-width="2" cx="${HOME.x}" cy="${HOME.y}"/>`;
  }
  g += `<circle id="ripple" class="ripple" cx="${t.x}" cy="${t.y}" r="10"/>`;
  svg.innerHTML = g;

  const ripple = $("ripple");
  const doRipple = () => { if(!reduce){ ripple.classList.remove("go"); void ripple.getBBox(); ripple.classList.add("go"); } };
  if(!route){ doRipple(); return; }
  const path = $("routeDraw"), runner = $("runner"), L = path.getTotalLength();
  if(reduce || !animate){ path.setAttribute("class","route"); const e = path.getPointAtLength(L); runner.setAttribute("cx",e.x); runner.setAttribute("cy",e.y); return; }
  path.style.strokeDasharray = L; path.style.strokeDashoffset = L;
  const start = performance.now(), dur = 1400;
  const step = now => {
    const k = Math.min(1,(now-start)/dur), e = 1-Math.pow(1-k,3);
    path.style.strokeDashoffset = L*(1-e);
    const pt = path.getPointAtLength(L*e); runner.setAttribute("cx",pt.x); runner.setAttribute("cy",pt.y);
    if(k<1) requestAnimationFrame(step);
    else { path.style.strokeDasharray=""; path.style.strokeDashoffset=""; path.setAttribute("class","route"); doRipple(); }
  };
  requestAnimationFrame(step);
}

/* ---------- Two-city clock ---------- */
const SUN_ICON = `<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="3.2" fill="#F2C230"/></svg>`;
const MOON_ICON = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8.6 8.9A4.2 4.2 0 0 1 4.3 1.6a4.4 4.4 0 1 0 4.3 7.3Z" fill="#C9B8F0"/></svg>`;
function tickClocks(){
  [["America/New_York","tDC","dDC"],["Asia/Kolkata","tBLR","dBLR"]].forEach(([tz,t,d])=>{
    const now = new Date();
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",weekday:"short",hour12:true}).formatToParts(now).map(x=>[x.type,x.value]));
    const h24 = +new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",hourCycle:"h23"}).format(now);
    $(t).textContent = `${p.hour}:${p.minute} ${p.dayPeriod.toLowerCase()}`;
    $(d).innerHTML = `${h24>=6 && h24<18 ? SUN_ICON : MOON_ICON}${p.weekday}`;
  });
}
tickClocks(); setInterval(tickClocks, 15000);

load().then(()=>requestAnimationFrame(()=>document.body.classList.add("ready")));
setInterval(load, 30*60*1000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && DATA && Date.now()-DATA.updated > 15*60*1000) load(); });
</script>
